spring:
  application:
    name: dpdms-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dpdms}
    username: ${DB_USERNAME:dpdms}
    password: ${DB_PASSWORD:dpdms}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    # leave MAIL_HOST empty to log e-mails to the console instead of sending them
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      # a missing or slow mail server must not make the whole application report DOWN
      enabled: false

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  mail-from: ${MAIL_FROM:no-reply@itzetech.example}
  jwt:
    # at least 32 characters. Always set JWT_SECRET in production.
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
    access-token-minutes: 480
  bootstrap-admin:
    # created on first start when the system has no administrator; must change the password at first sign-in
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@itzetech.local}
    full-name: ${BOOTSTRAP_ADMIN_NAME:System Administrator}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:ChangeMe#2026}
  # development only: put one-time codes and temporary passwords in API responses. Never enable in production.
  expose-secrets: ${EXPOSE_SECRETS:false}
  # RWF per hour: costs logged hours in invoice suggestions and the profit report
  hourly-rate: ${HOURLY_RATE:25000}
  jobs:
    # the scheduled jobs; the admin endpoints that run the same logic by hand always work
    enabled: ${JOBS_ENABLED:true}
    renewal-reminders-cron: ${RENEWAL_REMINDERS_CRON:0 0 7 * * *}
    ticket-sla-cron: ${TICKET_SLA_CRON:0 */15 * * * *}
